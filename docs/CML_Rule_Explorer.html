<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CML Interactive Explorer - UAT1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface2:#F5F8F9; --ink:#11242B; --muted:#5A6E76; --muted2:#7D8F96; --line:#D5DEE1;
  --accent:#0B6B78; --accent-ink:#FFFFFF; --accent-soft:#DCEFF1;
  --amber:#8F5300; --amber-soft:#FBEBCB; --good:#1B7A4B; --good-soft:#D9F1E3; --bad:#A33A3A; --bad-soft:#F7DDDD; --chip:#E6ECEE;
  --shadow:0 1px 2px rgba(17,36,43,.06),0 6px 20px rgba(17,36,43,.06);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A1F; --surface:#15262D; --surface2:#1A2F37; --ink:#E6F0F2; --muted:#93A9B1; --muted2:#7E939B; --line:#2A414A;
  --accent:#4FC1CF; --accent-ink:#06222A; --accent-soft:#12383F;
  --amber:#F0B65A; --amber-soft:#3A2C10; --good:#5CD08F; --good-soft:#12301F; --bad:#F08A8A; --bad-soft:#3A1717; --chip:#213840;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15262D; --surface2:#1A2F37; --ink:#E6F0F2; --muted:#93A9B1; --muted2:#7E939B; --line:#2A414A;
  --accent:#4FC1CF; --accent-ink:#06222A; --accent-soft:#12383F;
  --amber:#F0B65A; --amber-soft:#3A2C10; --good:#5CD08F; --good-soft:#12301F; --bad:#F08A8A; --bad-soft:#3A1717; --chip:#213840;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.92em}

/* header */
.top{max-width:1560px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.top h1{font:700 28px/1.1 var(--f-display);letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.top p{margin:0;color:var(--muted);max-width:720px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:92px}
.stat b{display:block;font:700 20px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* layout */
.shell{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr) minmax(380px,500px);gap:14px;align-items:start}
.rail,.detail,.listwrap .toolbar{}
.rail,.detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.rail{padding:14px}
.listwrap{min-width:0}
.detail{padding:0}

/* rail */
.rail h2{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.rail h2:first-of-type{margin-top:4px}
.field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;user-select:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted2)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px;margin-top:12px}
.linkbtn:hover{background:var(--accent-soft)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;color:var(--muted)}

/* toolbar + list */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar .count{color:var(--muted);font-size:13px}
.toolbar .count b{color:var(--ink)}
.sort{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-1px);border-color:var(--muted2)}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.card .nm{font:700 15px/1.25 var(--f-display)}
.card .api{font-family:var(--f-mono);font-size:11.5px;color:var(--muted2);margin-top:2px;word-break:break-all}
.card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted)}
.tag.err{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* detail */
.dhead{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dhead h2{font:700 22px/1.2 var(--f-display);margin:0 0 4px;letter-spacing:-.01em}
.dhead .api{font-family:var(--f-mono);font-size:12px;color:var(--muted2)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.cat{color:var(--ink);border:1px solid var(--line);background:var(--surface2)}
.dtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}
.dtab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dbody{padding:14px 20px 40px}
.sec{margin-bottom:18px}
.sec h3{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}
.item{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item .title{font-weight:600}
.item .cond{color:var(--muted);font-size:13px;margin-top:4px}
.item .concl{font-size:13px;margin-top:4px}
.item .msg{font-style:italic;font-size:13px;margin-top:4px;padding-left:10px;border-left:3px solid var(--line)}
.item .note{font-size:12px;color:var(--amber);margin-top:4px}
.item .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted2);margin-top:4px}
.badge{display:inline-block;font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.b-hide{background:var(--bad-soft);color:var(--bad)}
.b-disable{background:var(--amber-soft);color:var(--amber)}
.b-show{background:var(--good-soft);color:var(--good)}
.b-error{background:var(--bad-soft);color:var(--bad)}
.b-warning{background:var(--amber-soft);color:var(--amber)}
.b-info{background:var(--accent-soft);color:var(--accent)}
.b-other{background:var(--chip);color:var(--muted)}
details.src{margin-top:8px}
details.src summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:600}
pre.cml{margin:8px 0 0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font:12px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.close{display:none}
mark{background:var(--amber-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.hidden{display:none!important}

/* narrow screens: rail collapses, detail becomes a full-screen sheet */
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;display:none}
  .rail.open{display:block}
  .toggle-rail{display:inline-flex}
  .detail{position:fixed;inset:0;max-height:none;border-radius:0;z-index:50;display:none}
  .detail.open{display:block}
  .close{display:inline-flex;margin-bottom:8px}
  .dhead{padding-top:calc(14px + env(safe-area-inset-top,0px))}
}
.toggle-rail{display:none}
.toggle-rail,.close{align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>CML Rule Explorer</h1>
    <p>Browse the UAT1 Expression Set: validation messages, UI rules, defaults, and dependencies for each type, with the original CML alongside a plain-English description.</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="shell">
  <aside class="rail" id="rail" aria-label="Filters">
    <input id="q" class="field" type="search" placeholder="Search types, attributes, rules, messages…" autocomplete="off">
    <label class="check"><input id="deepSearch" type="checkbox" checked> Search inside rule and message text</label>

    <h2>Category</h2>
    <div class="chips" id="catChips"></div>

    <h2>Section</h2>
    <div class="chips" id="secChips"></div>

    <h2>Rule action</h2>
    <div class="chips" id="actChips"></div>

    <h2>Message severity</h2>
    <div class="chips" id="sevChips"></div>

    <button class="linkbtn" id="reset">Reset filters</button>
  </aside>

  <main class="listwrap">
    <div class="toolbar">
      <div style="display:flex;gap:8px;align-items:center">
        <button class="toggle-rail" id="toggleRail">Filters</button>
        <div class="count" id="count"></div>
      </div>
      <select id="sort" class="sort" aria-label="Sort products">
        <option value="name">Sort: Name A–Z</option>
        <option value="rules">Sort: Most items</option>
        <option value="errors">Sort: Most errors</option>
        <option value="category">Sort: Category</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty">No types match these filters.</div>
  </main>

  <aside class="detail" id="detail" aria-live="polite"></aside>
</div>

const CATEGORY_COLORS = {
  "Other":"#9aa3b2","Identity Services":"#a78bfa","Services":"#38bdf8","Measurement":"#4caf82",
  "Conversion APIs":"#e0567a","Analytics & Data":"#f97316","Activation":"#5b8cff","Clean Room":"#d99a3d",
  "Core / Bundle":"#eab308","Connections/Destinations":"#14b8a6"
};
const SECTIONS = [
  {key:"attributes", label:"Attributes"},
  {key:"rules", label:"UI rules"},
  {key:"messages", label:"Messages"},
  {key:"preferences", label:"Defaults"},
  {key:"dependencies", label:"Dependencies"}
];
const ACTIONS = ["hide","disable","show"];
const SEVERITIES = ["error","warning","info"];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cats = [...new Set(DATA.map(p => p.category))].sort();

// precompute searchable text per item
DATA.forEach(p => {
  p._hay = (p.name + " " + p.api + " " + p.parent).toLowerCase();
  SECTIONS.forEach(s => p[s.key].forEach(it => {
    it._text = Object.values(it).filter(v => typeof v === "string").join(" ").toLowerCase();
  }));
});

const state = {
  q: "", deep: true,
  cats: new Set(cats),
  secs: new Set(SECTIONS.map(s => s.key)),
  acts: new Set(ACTIONS),
  sevs: new Set(SEVERITIES),
  sort: "name",
  sel: null
};

const $ = id => document.getElementById(id);

function itemPasses(sec, it, productHit, q) {
  if (!state.secs.has(sec)) return false;
  if (sec === "rules" && !state.acts.has(it.action)) return false;
  if (sec === "messages" && !state.sevs.has(it.severity)) return false;
  if (!q || productHit) return true;
  return state.deep && it._text.includes(q);
}

function evaluate(p) {
  const q = state.q.trim().toLowerCase();
  const productHit = !!q && p._hay.includes(q);
  const visible = {};
  let total = 0;
  SECTIONS.forEach(s => {
    visible[s.key] = p[s.key].filter(it => itemPasses(s.key, it, productHit, q));
    total += visible[s.key].length;
  });
  const catOK = state.cats.has(p.category);
  const matches = catOK && (!q || productHit || total > 0) && (total > 0 || (!q && state.secs.size === SECTIONS.length && state.acts.size === ACTIONS.length && state.sevs.size === SEVERITIES.length));
  return {matches, visible, total, productHit, q};
}

function chipHTML(label, value, count, selected, dot) {
  return `<button class="chip" data-v="${esc(value)}" aria-pressed="${selected}">${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${esc(label)} <span class="n">${count}</span></button>`;
}

function renderFilters() {
  const countCat = c => DATA.filter(p => p.category === c).length;
  $("catChips").innerHTML = cats.map(c => chipHTML(c, c, countCat(c), state.cats.has(c), CATEGORY_COLORS[c] || "#999")).join("")
    + `<button class="linkbtn" data-all="cats" style="margin-top:4px">All</button><button class="linkbtn" data-none="cats" style="margin-top:4px">None</button>`;
  $("secChips").innerHTML = SECTIONS.map(s => chipHTML(s.label, s.key, DATA.reduce((n,p)=>n+p[s.key].length,0), state.secs.has(s.key))).join("");
  const actCount = a => DATA.reduce((n,p)=>n+p.rules.filter(r=>r.action===a).length,0);
  $("actChips").innerHTML = ACTIONS.map(a => chipHTML(a, a, actCount(a), state.acts.has(a))).join("");
  const sevCount = v => DATA.reduce((n,p)=>n+p.messages.filter(m=>m.severity===v).length,0);
  $("sevChips").innerHTML = SEVERITIES.map(v => chipHTML(v, v, sevCount(v), state.sevs.has(v))).join("");
}

function sortFn(a, b) {
  switch (state.sort) {
    case "rules": return b.total - a.total || a.p.name.localeCompare(b.p.name);
    case "errors": return b.errors - a.errors || a.p.name.localeCompare(b.p.name);
    case "category": return a.p.category.localeCompare(b.p.category) || a.p.name.localeCompare(b.p.name);
    default: return a.p.name.localeCompare(b.p.name);
  }
}

function hl(text) {
  const q = state.q.trim();
  if (!q || state.q.length < 2) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}

function renderList() {
  const rows = DATA.map(p => {
    const ev = evaluate(p);
    return {p, ...ev, errors: ev.visible.messages.filter(m => m.severity === "error").length};
  }).filter(r => r.matches).sort(sortFn);

  $("count").innerHTML = `<b>${rows.length}</b> of ${DATA.length} types`;
  $("empty").classList.toggle("hidden", rows.length > 0);
  if (!rows.length) { $("grid").innerHTML = ""; return rows; }

  if (!rows.some(r => r.p.id === state.sel)) state.sel = rows[0].p.id;
  $("grid").innerHTML = rows.map(r => {
    const p = r.p, c = CATEGORY_COLORS[p.category] || "#999";
    const tags = [
      r.visible.attributes.length && `<span class="tag">${r.visible.attributes.length} attr</span>`,
      r.visible.rules.length && `<span class="tag">${r.visible.rules.length} rules</span>`,
      r.visible.messages.length && `<span class="tag">${r.visible.messages.length} msgs</span>`,
      r.visible.preferences.length && `<span class="tag">${r.visible.preferences.length} defaults</span>`,
      r.visible.dependencies.length && `<span class="tag">${r.visible.dependencies.length} deps</span>`,
      r.errors && `<span class="tag err">${r.errors} errors</span>`
    ].filter(Boolean).join("");
    return `<button class="card" style="--c:${c}" data-id="${esc(p.id)}" aria-current="${p.id === state.sel}">
      <div class="nm">${hl(p.name)}</div>
      <div class="api">${esc(p.api)}</div>
      <div class="sub">${esc(p.category)}${p.parent ? " · extends " + esc(p.parent) : ""}</div>
      <div class="tags">${tags}</div>
    </button>`;
  }).join("");
  return rows;
}

function itemHTML(sec, it) {
  const cml = it.cml ? `<details class="src"><summary>View CML</summary><pre class="cml">${esc(it.cml)}</pre></details>` : "";
  if (sec === "attributes") {
    return `<div class="item"><div class="title">${esc(it.name)} <span class="muted mono">${esc(it.type)}</span></div>
      ${it.default ? `<div class="meta">${esc(it.default)}</div>` : ""}
      ${it.values ? `<div class="cond">${esc(it.values)}</div>` : ""}</div>`;
  }
  if (sec === "rules") {
    return `<div class="item"><div><span class="badge b-${esc(it.action)}">${esc(it.action)}</span><span class="title">${esc(it.title)}</span></div>
      <div class="cond">${esc(it.cond)}</div>${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}${cml}</div>`;
  }
  if (sec === "messages") {
    return `<div class="item"><div><span class="badge b-${esc(it.severity)}">${esc(it.severity)}</span></div>
      <div class="cond">${esc(it.cond)}</div>${it.text ? `<div class="msg">${esc(it.text)}</div>` : ""}${cml}</div>`;
  }
  // preferences and dependencies
  const badge = sec === "dependencies" ? `<span class="badge b-other">requires</span>` : "";
  return `<div class="item">${badge}<div class="cond">${esc(it.cond)}</div>${it.conclusion ? `<div class="concl">${esc(it.conclusion)}</div>` : ""}${cml}</div>`;
}

function renderDetail() {
  const el = $("detail");
  const p = DATA.find(x => x.id === state.sel);
  if (!p) { el.innerHTML = `<div class="dbody muted">Select a type to see its rules.</div>`; return; }
  const ev = evaluate(p);
  const q = state.q.trim().toLowerCase();
  const tabs = SECTIONS.map(s => `<span class="dtab" aria-pressed="${state.secs.has(s.key)}">${s.label} ${ev.visible[s.key].length}/${p[s.key].length}</span>`).join("");
  const body = SECTIONS.filter(s => state.secs.has(s.key) && ev.visible[s.key].length).map(s => `
    <section class="sec">
      <h3><span>${s.label}</span><span class="mono">${ev.visible[s.key].length}</span></h3>

    </section>`).join("");
  el.innerHTML = `
    <button class="close" id="closeDetail">← Back to list</button>
    <div class="dhead">
      <h2>${esc(p.name)}</h2>
      <div class="api">${esc(p.api)}</div>
      <div class="pills">
        <span class="pill cat"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CATEGORY_COLORS[p.category]||"#999"};margin-right:6px"></span>${esc(p.category)}</span>
        ${p.parent ? `<span class="pill">extends ${esc(p.parent)}</span>` : ""}
      </div>
      <div class="dtabs">${tabs}</div>
    </div>
    <div class="dbody">
      ${body || `<div class="empty">Nothing matches the current filters for this product.</div>`}
    </div>`;
  const cb = $("closeDetail");
  if (cb) cb.onclick = () => { el.classList.remove("open"); };
}

function renderStats() {
  const t = k => DATA.reduce((n,p)=>n+p[k].length,0);
  $("stats").innerHTML = [
    ["UI rules", t("rules")], ["Messages", t("messages")],
    ["Defaults", t("preferences")], ["Dependencies", t("dependencies")]
  ].map(([l,v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}

function render() {
  renderFilters();
  renderList();
  renderDetail();
  history.replaceState(null, "", state.sel ? "#" + state.sel : location.pathname);
}

function select(id) {
  state.sel = id;
  renderList(); renderDetail();
  history.replaceState(null, "", "#" + id);
  if (window.matchMedia("(max-width:1100px)").matches) $("detail").classList.add("open");
}

// events
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("deepSearch").addEventListener("change", e => { state.deep = e.target.checked; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("reset").addEventListener("click", () => {
  state.q = ""; $("q").value = ""; state.deep = true; $("deepSearch").checked = true;
  state.cats = new Set(cats); state.secs = new Set(SECTIONS.map(s=>s.key));
  state.acts = new Set(ACTIONS); state.sevs = new Set(SEVERITIES);
  render();
});
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip && chip.parentElement.id !== "grid") {
    const pid = chip.parentElement.id;
    const v = chip.dataset.v;
    const set = pid === "catChips" ? state.cats : pid === "secChips" ? state.secs : pid === "actChips" ? state.acts : state.sevs;
    set.has(v) ? set.delete(v) : set.add(v);
    render(); return;
  }
  const all = e.target.closest("[data-all]"), none = e.target.closest("[data-none]");
  if (all || none) { state.cats = all ? new Set(cats) : new Set(); render(); return; }
  const card = e.target.closest(".card");
  if (card) select(card.dataset.id);
});
$("toggleRail").addEventListener("click", () => $("rail").classList.toggle("open"));
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && DATA.some(p => p.id === id)) { state.sel = id; render(); }
});

// init
const initialHash = location.hash.slice(1);
if (initialHash && DATA.some(p => p.id === initialHash)) state.sel = initialHash;
renderStats();
render();
</script>
</body>
</html>
